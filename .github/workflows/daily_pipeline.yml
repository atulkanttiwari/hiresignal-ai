# Free daily cron schedule (8:07 AM IST) via GitHub Actions
name: Daily Job Intelligence Pipeline

on:
  schedule:
    # Runs daily at 8:07 AM IST (02:37 UTC — off-peak minute to avoid GitHub cron drops)
    - cron: '37 2 * * *'
  workflow_dispatch: # Lets you trigger it manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite database cache
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Create resume file from secret
        env:
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: |
          mkdir -p config data logs
          printf "%s" "$RESUME_TEXT" > config/resume.txt

      - name: Run ELT Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_MATCH_SCORE: ${{ secrets.MIN_MATCH_SCORE }}
        run: python pipeline.py
# Triggered twice daily via cron-job.org (8:17 AM IST: jobspy | 8:37 PM IST: ats)
name: Daily Job Intelligence Pipeline

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Which job source to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - jobspy
          - ats

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite database cache
        uses: actions/cache@v6
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Create resume file from secret
        env:
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: |
          mkdir -p config data logs
          printf "%s" "$RESUME_TEXT" > config/resume.txt

      - name: Run ELT Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_MATCH_SCORE: ${{ secrets.MIN_MATCH_SCORE }}
          JOB_SOURCE: ${{ inputs.source || 'all' }}
        run: python pipeline.py